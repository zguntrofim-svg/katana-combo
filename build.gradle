plugins { id 'fabric-loom' version '1.9.2' }
version = '0.14.0'
group = 'dev.animerpg'
base { archivesName = 'katana-combo' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.register('comboCheck', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.animerpg.combo.ComboTimingCheck'; enableAssertions = true }
check.dependsOn comboCheck
